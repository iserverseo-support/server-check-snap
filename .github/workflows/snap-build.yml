name: Build Snap

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Snapcraft
        uses: canonical/action-install-snapcraft@v2

      - name: Build Snap
        run: snapcraft pack

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-check-snap
          path: "*.snap"
